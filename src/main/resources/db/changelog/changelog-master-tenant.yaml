databaseChangeLog:
  - changeSet:
      id: 1-tenant-users
      author: antigravity
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(50)
                  constraints:
                    nullable: false
  - changeSet:
      id: 2-tenant-courses
      author: antigravity
      changes:
        - createTable:
            tableName: courses
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: tutor_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_course_tutor
                    references: users(id)
  - changeSet:
      id: 3-tenant-lessons
      author: antigravity
      changes:
        - createTable:
            tableName: lessons
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: course_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_lesson_course
                    references: courses(id)
              - column:
                  name: video_s3_key
                  type: varchar(500)
              - column:
                  name: document_s3_key
                  type: varchar(500)
              - column:
                  name: zoom_join_url
                  type: varchar(500)
              - column:
                  name: zoom_meeting_id
                  type: varchar(255)
              - column:
                  name: scheduled_at
                  type: timestamp
  - changeSet:
      id: 4-tenant-enrollments
      author: antigravity
      changes:
        - createTable:
            tableName: enrollments
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_enrollment_user
                    references: users(id)
              - column:
                  name: course_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_enrollment_course
                    references: courses(id)
              - column:
                  name: enrolled_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
  - changeSet:
      id: 5-course-price
      author: antigravity
      changes:
        - addColumn:
            tableName: courses
            columns:
              - column:
                  name: price
                  type: numeric(10,2)
                  defaultValueNumeric: 0.00
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: PUBLISHED
  - changeSet:
      id: 6-tenant-payments
      author: antigravity
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_payment_user
                    references: users(id)
              - column:
                  name: course_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_payment_course
                    references: courses(id)
              - column:
                  name: amount
                  type: numeric(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(10)
                  defaultValue: USD
              - column:
                  name: gateway
                  type: varchar(50)
              - column:
                  name: transaction_ref
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
  - changeSet:
      id: 7-tenant-lesson-progress
      author: antigravity
      changes:
        - createTable:
            tableName: lesson_progress
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_progress_user
                    references: users(id)
              - column:
                  name: lesson_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_progress_lesson
                    references: lessons(id)
              - column:
                  name: is_completed
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: last_position_seconds
                  type: integer
                  defaultValueNumeric: 0
              - column:
                  name: updated_at
                  type: timestamp
