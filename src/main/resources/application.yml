spring:
  application:
    name: lms-backend
  datasource:
    url: jdbc:postgresql://${AWS_RDS_ENDPOINT:localhost}:5432/postgres
    username: postgres
    # Password is automatically injected by Spring Cloud AWS Secrets Manager if keys match, 
    # or explicitly mapped here:
    password: ${spring.datasource.password:password}
    driver-class-name: org.postgresql.Driver
  config:
    import: aws-secretsmanager:/secrets/lms-backend-${spring.profiles.active:dev}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: false # Handled manually by MultiTenantLiquibaseConfig
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
      region:
        static: us-east-1

